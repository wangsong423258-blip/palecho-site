<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>提交支持工单 | PalEcho</title><link rel="stylesheet" href="/support-detail.css?v=20260731-1"/></head><body><header class="support-detail-nav"><a class="support-detail-brand" href="/index.html">PalEcho</a><a class="support-detail-back" href="/help-center.html">← 返回支持中心</a></header><main class="support-detail-main"><div class="support-crumb"><a href="/help-center.html">官方技术支持</a><span>/</span><span>提交支持工单</span></div><section class="support-detail-card" id="ticket-view"><header class="support-ticket-heading"><p>官方工单服务</p><h1>提交支持工单</h1><span>请尽可能完整地描述问题，我们会根据你提供的信息尽快处理。</span></header><div class="support-ticket-status"><span><b>01</b>待处理</span><span><b>02</b>处理中</span><span><b>03</b>已回复</span><span><b>04</b>已解决</span></div><form class="support-ticket-form" id="ticket-form"><div class="support-form-grid"><label>问题类型<select required><option value="" selected disabled>请选择问题类型</option><option>设备使用</option><option>健康数据</option><option>账户与会员</option><option>商城与订单</option><option>系统服务</option><option>其他问题</option></select></label><label>问题标题<input required placeholder="请用一句话概括遇到的问题"/></label></div><label>问题描述<textarea required rows="7" placeholder="请描述问题发生的时间、操作步骤和当前情况"></textarea></label><div class="support-form-grid"><label>设备型号（可选）<input placeholder="例如：Pulse 01"/></label><label>账户信息（可选）<input placeholder="手机号或邮箱"/></label></div><label>上传图片或视频（可选）<input type="file" accept="image/*,video/*" multiple/></label><label>联系方式<input required placeholder="方便我们回复你的手机号或邮箱"/></label><p class="support-form-note">请勿填写密码、支付验证码等敏感信息。提交即表示你同意我们使用上述信息处理本次支持请求。</p><button class="support-primary" type="submit">提交工单 <span>→</span></button></form></section></main><script src="/support-i18n.js?v=20260731-1"></script><script src="/support-ticket.js?v=20260731-2"></script></body></html>
